name: Improvement proposal
description: Explain a specific problem and a possible improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe a real use case with fictional details.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior and alternatives
    validations:
      required: true
